name: CI & add-on images

# Every push / PR: typecheck, tests, add-on lint, image build (no push).
# A v* tag (on a release/v<version> branch, see README "Releasing"): the same, then push
# ghcr.io/<owner>/{amd64,aarch64}-{teobeanie,teobeanie-whisper}:<version> (the two add-ons
# release together, at one version), check that all pull anonymously, and
# only then fast-forward main to the tag. main carries a version only once its image exists,
# because the add-on store reads config.yaml from main.
# The tag must equal teobeanie/config.yaml's version: the Supervisor pulls exactly that tag.
# A push to main also checks that the version it carries has its images (guard).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy scan
        run: node scripts/privacy-scan.mjs
        env:
          PRIVACY_DENY: ${{ secrets.PRIVACY_DENY }}
      - run: pnpm run typecheck
      - run: pnpm --filter teobeanie-panel run typecheck
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./teobeanie
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./whisper

  build:
    needs: [test, lint]
    strategy:
      matrix:
        addon:
          # Teobeanie builds with the repository root as context; Teobeanie Whisper with its folder.
          - { name: teobeanie, folder: teobeanie, context: . }
          - { name: teobeanie-whisper, folder: whisper, context: whisper }
        arch:
          - { haarch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { haarch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: echo "version=$(grep '^version:' ${{ matrix.addon.folder }}/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Release tag must match the add-on version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ${{ matrix.addon.folder }}/config.yaml version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch.haarch }}-${{ matrix.addon.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on release tags)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.addon.context }}
          file: ${{ matrix.addon.folder }}/Dockerfile
          platforms: ${{ matrix.arch.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.addon.name }}-${{ matrix.arch.haarch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon.name }}-${{ matrix.arch.haarch }}

  # The images exist and pull anonymously, as an install pulls them.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-images.sh "${GITHUB_REF_NAME#v}"

  # Only now does main carry the version. Fast-forward only: if main moved since the release
  # branch was cut, this fails and the release is redone on the new main (README "Releasing").
  # A push with GITHUB_TOKEN starts no workflow, so main is not built twice.
  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tag
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main is not an ancestor of ${GITHUB_REF_NAME}: main moved after the release branch was cut." >&2
            echo "Delete the tag and the release branch, then run scripts/release.sh again." >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/main"

  # main must never offer an update whose image is missing.
  guard:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: main's add-on version has its images
        run: scripts/check-images.sh
