name: CI & add-on images

# Every push / PR: typecheck, tests, add-on lint, image build (no push).
# A v* tag: the same, then push ghcr.io/<owner>/{amd64,aarch64}-teobeanie:<version>.
# The tag must equal teobeanie/config.yaml's version: the Supervisor pulls exactly that tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy scan
        run: node scripts/privacy-scan.mjs
        env:
          PRIVACY_DENY: ${{ secrets.PRIVACY_DENY }}
      - run: pnpm run typecheck
      - run: pnpm --filter teobeanie-panel run typecheck
      - run: pnpm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./teobeanie

  build:
    needs: [test, lint]
    strategy:
      matrix:
        include:
          - haarch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - haarch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: echo "version=$(grep '^version:' teobeanie/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Release tag must match the add-on version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match config.yaml version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.haarch }}-teobeanie" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on release tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: teobeanie/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.haarch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.haarch }}
